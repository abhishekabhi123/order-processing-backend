services: 
  postgres:
    image: postgres:17
    container_name: overflow-postgres
    restart: unless-stopped 
    ports: 
      - "5432:5432"
    environment: 
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=overflow
    volumes: 
      - postgres_data:/var/lib/postgresql/data


  redis: 
    image: redis:7
    container_name: overflow-redis
    restart: unless-stopped 
    ports: 
      - "6379:6379"
    volumes: 
      - redis_data:/data
  
  